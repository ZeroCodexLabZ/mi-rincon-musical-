<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> mi rincon musical🐻🎀</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #8d4765;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #fff7fb, #fbd6e5, #fff0f6);
    }

    #decor { position: fixed; inset: 0; pointer-events: none; }

    .adorno {
      position: absolute;
      color: #e8a0bd;
      opacity: .65;
      animation: flotar 4s ease-in-out infinite alternate;
    }

    @keyframes flotar {
      to { transform: translateY(-12px) rotate(14deg); }
    }

    main {
      position: relative;
      width: min(760px, 90vw);
      min-height: 430px;
      padding: 34px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 3px solid #f6c2d7;
      border-radius: 30px;
      background: rgba(255, 249, 252, .9);
      box-shadow: 0 18px 55px #bd6c8a2b;
    }

    h1 { margin: 0 0 22px; font-size: 1.2rem; letter-spacing: .12em; }

    #letras {
      min-height: 100px;
      display: grid;
      place-items: center;
      font-size: clamp(1.5rem, 5vw, 2.4rem);
      font-weight: bold;
      line-height: 1.35;
    }

    .gatita { position: absolute; width: 95px; left: 20px; bottom: 18px; }

    .controles {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    button, .archivo {
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      background: #f8c7dc;
      color: #8d4765;
      font: bold 1rem "Segoe UI", sans-serif;
      cursor: pointer;
    }

    button:hover, .archivo:hover { background: #f3a9c7; }
    input[type="file"] { display: none; }
    #estado { min-height: 1.5em; }

    @media (max-width: 520px) {
      main { min-height: 390px; padding-bottom: 110px; }
      .gatita { width: 78px; }
    }
  </style>
</head>

<body>
  <div id="decor" aria-hidden="true"></div>

  <main>

    <div id="letras">Elige una canción y pulsa reproducir 🎵</div>

    <svg class="gatita" viewBox="0 0 110 110" aria-label="Gatita decorativa">

            fill="white" stroke="#e8a0bd" stroke-width="3"/>
      <ellipse cx="40" cy="63" rx="3" ry="5" fill="#8d4765"/>
      <ellipse cx="70" cy="63" rx="3" ry="5" fill="#8d4765"/>
      <ellipse cx="55" cy="71" rx="4" ry="3" fill="#f3a6b6"/>
      <path d="M39 74 20 70M39 80 20 82M71 74 90 70M71 80 90 82"

      <path d="M78 24c-8-10 1-18 10-11 9-7 18 1 10 11l-10 9z"
            fill="#ff8fb8" stroke="#e26e9b" stroke-width="2"/>

    <div class="controles">
      <label class="archivo" for="archivo">Elegir canción</label>

      { segundo: 190, texto: "Desde este momento" },
      { segundo: 193, texto: "No podrás sacarte esta canción de tu cabeza" },
      { segundo: 198, texto: "Chino y Nacho" },
      { segundo: 201, texto: "Mi niña bonita" },
      { segundo: 204, texto: "Tú y únicamente tú" },
      { segundo: 204, texto: "Mi niña bonita" },
      { segundo: 211, texto: "Más nah" }
    ];

    const audio = document.querySelector("#audio");
    const cajaLetras = document.querySelector("#letras");
    const estado = document.querySelector("#estado");
    let fraseActual = -1;
    let temporizadorDeLetras;

    // Corazones y estrellas.
    const decor = document.querySelector("#decor");

    for (let i = 0; i < 34; i++) {
      const adorno = document.createElement("span");
      adorno.className = "adorno";
      adorno.textContent = i % 2 ? "♡" : "✦";
      adorno.style.left = `${(i * 37 + 8) % 100}%`;
      adorno.style.top = `${(i * 61 + 5) % 100}%`;
      adorno.style.fontSize = `${14 + (i % 3) * 6}px`;
      decor.appendChild(adorno);
    }

    document.querySelector("#archivo").addEventListener("change", (evento) => {
      const archivo = evento.target.files[0];
      if (!archivo) return;

      audio.src = URL.createObjectURL(archivo);
      audio.pause();
      fraseActual = -1;
      cajaLetras.textContent = "Pulsa reproducir cuando estés lista 💗";
      estado.textContent = `Canción lista: ${archivo.name}`;
    });

    function escribirFrase(texto) {
      clearInterval(temporizadorDeLetras);
      cajaLetras.textContent = "";
      let posicion = 0;

      temporizadorDeLetras = setInterval(() => {
        cajaLetras.textContent += texto[posicion] || "";
        posicion++;

        if (posicion >= texto.length) {
          clearInterval(temporizadorDeLetras);
        }
      }, 45);
    }

    function sincronizarLetras() {
      let encontrada = -1;

      for (let i = 0; i < LETRAS.length; i++) {
        if (LETRAS[i].segundo <= audio.currentTime) encontrada = i;
      }

      if (encontrada !== fraseActual) {
        fraseActual = encontrada;

        if (encontrada === -1) {
          cajaLetras.textContent = "";
        } else {
          escribirFrase(LETRAS[encontrada].texto);
        }
      }
    }

    audio.addEventListener("timeupdate", sincronizarLetras);

    document.querySelector("#reproducir").addEventListener("click", async () => {
      if (!audio.src) {
        estado.textContent = "Primero elige el MP3 de Niña Bonita.";
        return;
      }

      try {
        await audio.play();
        estado.textContent = "¡La música y las frases están en camino! 🎶";
      } catch {
        estado.textContent = "No pude reproducir ese archivo. Prueba con el MP3.";
      }
    });

    document.querySelector("#pausar").addEventListener("click", () => {
      audio.pause();
      clearInterval(temporizadorDeLetras);
      fraseActual = -1;
      estado.textContent = "En pausa. Pulsa reproducir para continuar.";
    });

    audio.addEventListener("ended", () => {
      clearInterval(temporizadorDeLetras);
      estado.textContent = "La canción terminó 💗";
    });
  </script>
</body>
</html>
